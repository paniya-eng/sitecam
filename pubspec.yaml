name: sitecam
description: "دوربین ثبت پروژه‌های ساختمانی با مُهر تاریخ، GPS و مشخصات روی عکس و فیلم"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # دوربین (عکس و فیلم)
  camera: ^0.11.0
  # موقعیت GPS
  geolocator: ^12.0.0
  # مسیر ذخیره‌سازی فایل‌ها در گوشی
  path_provider: ^2.1.0
  # درخواست مجوزها (دوربین، موقعیت، گالری)
  permission_handler: ^11.0.0
  # فرمت تاریخ میلادی
  intl: ^0.19.0
  # تاریخ شمسی
  shamsi_date: ^1.0.0
  # ذخیره عکس/فیلم در گالری گوشی
  gal: ^2.0.0
  # ذخیره تنظیمات کاربر
  shared_preferences: ^2.0.0
  # ساختن فایل PDF (گزارش تصویری پروژه)
  pdf: ^3.11.0
  # اشتراک‌گذاری فایل PDF
  printing: ^5.13.0
  # پخش فیلم داخل خود اپ
  video_player: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # ساخت خودکار آیکن اپ برای اندروید و iOS
  flutter_launcher_icons: ^0.14.1

# تنظیم آیکن اپ (با دستور: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/sitecam_icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
