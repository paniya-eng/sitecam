name: Build Android APK

# اجرای خودکار با هر push روی شاخه main + اجرای دستی از تب Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: گرفتن کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # در مخزن ما پوشه android وجود ندارد؛ این دستور آن را می‌سازد
      # و فایل‌های lib و pubspec.yaml را دست‌نخورده نگه می‌دارد
      - name: ساخت پوشه‌های پلتفرم (Android)
        run: flutter create . --project-name sitecam --platforms=android

      # پکیج دوربین به minSdk حداقل ۲۴ نیاز دارد؛ قالب پیش‌فرض فلاتر کمتر است
      - name: تنظیم حداقل نسخه اندروید (minSdk = 24)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts
            echo "=== build.gradle.kts ==="
            grep -n "minSdk" android/app/build.gradle.kts
          else
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
            echo "=== build.gradle ==="
            grep -n "minSdk" android/app/build.gradle
          fi

      - name: تنظیم اسم اپ و مجوزهای دوربین و GPS
        run: |
          sed -i 's|android:label="sitecam"|android:label="سایت‌کم"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n        <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n        <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n        <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n        <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n        <application|' android/app/src/main/AndroidManifest.xml
          echo "=== Manifest بعد از اصلاح ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت آیکن اپ از assets/icon/sitecam_icon.png
        run: dart run flutter_launcher_icons

      - name: ساخت APK (نسخه release)
        # این دستور به‌صورت خودکار هم خروجی را نشان می‌دهد و هم در فایل ذخیره می‌کند
        run: flutter build apk --release --stacktrace 2>&1 | tee build-apk.log

      - name: اگر ساخت شکست خورد، لاگ را برای دانلود آپلود کن
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-apk.log
          retention-days: 30

      - name: آپلود APK به عنوان خروجی قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: sitecam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
