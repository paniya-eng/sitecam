name: sitecam
description: "دوربین ثبت پروژه‌های ساختمانی با مُهر تاریخ، GPS و مشخصات روی عکس و فیلم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # دوربین (عکس و فیلم)
  camera: ^0.11.0
  # موقعیت GPS
  geolocator: ^12.0.0
  # مسیر ذخیره‌سازی فایل‌ها در گوشی
  path_provider: ^2.1.0
  # درخواست مجوزها (دوربین، موقعیت، گالری)
  permission_handler: ^11.0.0
  # فرمت تاریخ میلادی
  intl: ^0.19.0
  # تاریخ شمسی
  shamsi_date: ^1.0.0
  # ذخیره عکس/فیلم در گالری گوشی
  gal: ^2.0.0
  # ذخیره تنظیمات کاربر
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
